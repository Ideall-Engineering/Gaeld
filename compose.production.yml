name: gaeld

x-logging: &default-logging
    driver: json-file
    options:
        max-size: 10m
        max-file: 5

x-app-service: &app-service
    image: gaeld/app:${GAELD_IMAGE_TAG:-7ca5518}
    build:
        context: .
        dockerfile: docker/production/Dockerfile
        target: app
    env_file:
        - ${GAELD_ENV_FILE:-.env.production}
    init: true
    restart: unless-stopped
    labels:
        com.centurylinklabs.watchtower.enable: "false"
    logging: *default-logging
    volumes:
        - gaeld-storage:/var/www/html/storage
    networks:
        - frontend
        - backend
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    app:
        <<: *app-service
        command: ["php-fpm", "--nodaemonize"]
        healthcheck:
            test: ["CMD", "php-fpm", "-t"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s

    nginx:
        image: gaeld/web:${GAELD_IMAGE_TAG:-7ca5518}
        build:
            context: .
            dockerfile: docker/production/Dockerfile
            target: web
        restart: unless-stopped
        init: true
        entrypoint: ["nginx"]
        command: ["-g", "daemon off;"]
        ports:
            - "127.0.0.1:${APP_PORT:-8088}:8080"
        labels:
            com.centurylinklabs.watchtower.enable: "false"
        logging: *default-logging
        volumes:
            - gaeld-storage:/var/www/html/storage:ro
        networks:
            - frontend
            - proxy
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/up"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 30s

    horizon:
        <<: *app-service
        command: ["php", "artisan", "horizon", "--no-interaction"]
        networks:
            - backend
        stop_grace_period: 3m
        healthcheck:
            test: ["CMD", "php", "artisan", "horizon:status"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    scheduler:
        <<: *app-service
        command: ["php", "artisan", "schedule:work", "--no-interaction"]
        networks:
            - backend
        stop_grace_period: 1m

    postgres:
        image: postgres:16.14-alpine3.24
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set}
            POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
        labels:
            com.centurylinklabs.watchtower.enable: "false"
        logging: *default-logging
        shm_size: 256m
        volumes:
            - gaeld-postgres:/var/lib/postgresql/data
        networks:
            - backend
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -q -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\""]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

    redis:
        image: redis:7.4.10-alpine3.21
        restart: unless-stopped
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
        command:
            - sh
            - -c
            - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        labels:
            com.centurylinklabs.watchtower.enable: "false"
        logging: *default-logging
        volumes:
            - gaeld-redis:/data
        networks:
            - backend
        healthcheck:
            test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 5s

networks:
    frontend:
        driver: bridge
    backend:
        driver: bridge
    proxy:
        external: true

# Volume names are pinned explicitly so they never inherit the compose project
# prefix. Without this, a `docker compose up` would bind to the pre-existing
# gaeld_gaeld-* volumes from an earlier deployment, which still hold data.
volumes:
    gaeld-postgres:
        name: gaeld-postgres
    gaeld-redis:
        name: gaeld-redis
    gaeld-storage:
        name: gaeld-storage
